<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>QA 工具 · 我的任务</title><link rel="stylesheet" href="./qa.css"><script defer src="/assets/vendor/supabase.js"></script><script defer src="/assets/config.js"></script><script defer src="./import-parser.js"></script><script defer src="./imports.js"></script><script defer src="./qa.js"></script></head>
<body data-page="workspace"><header><a class="brand" href="/QA/">QA 工具</a><nav><a href="/tool/">返回工作台</a><span id="account"></span><button id="logout" hidden>退出登录</button></nav></header><p id="auth-loading" role="status">正在确认登录状态…</p>
<main id="protected-content" hidden><div class="heading"><div><p class="eyebrow">LISTING FAQ · 美国站</p><h1>把产品事实变成清楚的回答</h1><p>英文成稿附中文对照。保存任务后可分类导入资料，核对来源和版本。问答生成待开放。</p></div><button id="new-task" class="primary">新建 QA 任务</button></div>
<p id="message" role="status" aria-live="polite"></p>
<section id="editor" class="panel" hidden><div class="section-heading"><h2>任务准备</h2><button id="close-editor" type="button">返回任务列表</button></div><form id="draft-form"><div class="grid"><label>产品名称<input id="product-name" required autocomplete="off" placeholder="填写这次准备 FAQ 的产品"></label><label>ASIN（选填）<input id="asin" maxlength="10" pattern="[A-Za-z0-9]{10}" autocomplete="off" placeholder="未上架产品可留空"></label><label>问答组数<input id="qa-count" type="number" min="1" step="1" value="5" required></label><label>输出方式<input value="美国站 · 英文附中文对照" disabled></label></div><p>先保存任务，再分类上传或粘贴资料；写作指令单独填写。</p><div class="actions"><span id="save-state">尚未保存</span><button id="save-draft" class="primary" type="submit">保存</button></div></form><section id="imports" class="imports"></section><div class="future"><span>事实与规则确认 · 待开放</span><span>问题选择 · 待开放</span><span>生成与审核 · 待开放</span><span>Excel / 纯文本导出 · 待开放</span></div></section>
<section class="panel"><div class="section-heading"><div><h2>我的任务</h2><p>保存的任务可在刷新后继续编辑。</p></div><button id="refresh">刷新</button></div><div id="task-list"></div><p id="empty" hidden>还没有任务。点击“新建 QA 任务”开始。</p><button id="more" hidden>加载更多</button></section></main><footer>QA 独立任务 · 仅显示当前账号的数据</footer></body></html>
