<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QA 工具 · 简化改版</title><link rel="stylesheet" href="simple.css"><link rel="stylesheet" href="/assets/tool-shell.css?v=20261005-1"><script defer src="/assets/tool-shell.js?v=20261005-1"></script><script defer src="import-parser.js"></script><script defer src="source-intake.js"></script><script defer src="question-core.js"></script><script defer src="question-context.js"></script><script defer src="answer-store.js"></script><script defer src="task-adapter.js"></script><script defer src="flow-adapter.js"></script><script defer src="result-core.js"></script><script defer src="simple.js"></script><script defer src="workspace.js"></script></head>
<body><header><strong>QA 工具</strong><span>美国站 · 英文附中文对照</span><a href="/tool/">返回工作台</a><button id="logout" hidden>退出登录</button></header>
<main><p id="notice" role="status" aria-live="polite"></p>
<section id="input-screen"><h1>把产品资料，写成买家关心的回答</h1><p class="muted">上传资料、填写要求，剩下的整理和撰写交给后台。</p>
<div class="fields"><label>产品名称<input id="product" placeholder="例如：粘球抛接套装"></label><label>生成数量<select id="quantity"><option>5</option><option>10</option><option>20</option><option>25</option></select></label></div><details><summary>产品标识（选填）</summary><label>ASIN<input id="asin" maxlength="10" placeholder="已有 ASIN 可填写"></label></details>
<section class="upload"><h2>上传产品资料</h2><p>产品参数、消费者洞察、关键词、自家及竞品评论可一起选择。</p><label class="file-button">选择文件<input id="files" type="file" multiple accept=".docx,.xlsx,.csv"></label><p class="muted">Word、Excel、CSV · 单个文件不超过 10 MB</p><div id="file-list"></div><div id="saved-sources"></div><details><summary>也可以直接粘贴资料</summary><label>资料分类<select id="paste-kind"><option value="product">产品资料</option><option value="insight">消费者洞察</option><option value="keywords">关键词</option><option value="own_reviews">自家评论</option><option value="competitor_reviews">竞品评论</option></select></label><label>竞品标识（粘贴竞品评论时填写）<input id="paste-product"></label><textarea id="paste" rows="5" aria-label="粘贴资料" placeholder="粘贴本类资料，写作要求请填写在下面"></textarea></details></section>
<label>额外要求 <span class="muted">选填</span><textarea id="instructions" rows="3" placeholder="例如：突出家庭和沙滩场景，回答自然直接。"></textarea></label>
<div class="actions"><button id="generate" class="primary">生成 QA</button><button id="save-input" hidden>保存资料</button><span class="muted">真实生成前会显示本轮调用范围与费用上限</span></div><details id="tasks-area" hidden><summary>我的任务</summary><button id="new-task">新建任务</button><div id="task-list"></div></details></section>
<section id="result-screen" hidden><div class="heading"><div><h1 id="result-title"></h1><p id="counts" class="muted"></p></div><button id="back">返回资料</button></div>
<div class="actions toolbar"><label>复制与文本语言<select id="language"><option value="en">英文</option><option value="both">中英对照</option></select></label><button id="copy">复制全部</button><button id="excel" class="primary">下载 Excel</button><button id="text">下载纯文本</button></div>
<label id="edited-option" class="check" hidden><input id="include-edited" type="checkbox">一并包含已修改、未重新检查事实的内容</label><p id="export-range" class="muted"></p><div id="cards"></div></section>
</main></body></html>
